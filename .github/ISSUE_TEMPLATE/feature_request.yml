name: Feature idea
description: Suggest an improvement or a new agent, indicator or city feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself
